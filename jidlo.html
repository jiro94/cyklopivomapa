<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <link rel="icon" href="favicon.ico" id="icon" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <title>Cyklopivo mapa</title>
<body>
    <div class="container">
        <div class="top">
            <h1 class="nadpis">CykloPivoMapa</h1>
            <img src="logo.png" id="logo">
            <div class="dropdown">
                <button class="dropbutt">Menu</button>
                <div class="dropdown-content">
                  <a class="drop"  href="index.html">Výčepny</a>
                  <a class="drop"  href="pivoteky.html">Pivotéky</a>
                  <a class="drop"  href="jidlo.html">Jídlo</a>
                </div>
            </div>
        </div>
        <div class="main">
            <div id="textbox">
                <ul id="seznam">
                    <li><button onclick="map.setView(coords[0],17)">Rafa pizza</button></li>
                    <li><button onclick="map.setView(coords[4],17)">Skautská 11</button></li>
                    <li><button onclick="map.setView(coords[2],17)">Hood Bistro</button></li>
                    <li><button onclick="map.setView(coords[6],17)">Bistruck</button></li> 
                    <li><button onclick="map.setView(coords[3],17)">Restaurace Osaka</button></li>
                    <li><button onclick="map.setView(coords[1],17)">Zendino</button></li>
                </ul>
            </div>
            <div id="map"></div>
             <!-- Include Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        
   
        // defaultní pohled dle souřadnic a zoom
        var map = L.map('map').setView([49.78, 18.26], 11); // Coordinates Ostrava

        // přidání mapového podkladu do divu z openstreetmap + max zoom + copyright
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        //souřadnice
        let coords = [
            [49.83654, 18.18228],   //rafa
            [49.83494, 18.28730],   //zendino
            [49.78570, 18.26619],   //hood
            [49.81065, 18.25623],   //osaka
            [49.82617, 18.17739],    //skautská 11
            [49.78368, 18.24922]    //dobroty u dakoty
            [49.77684, 18.45313]    //bistruck havr
        ]
        //markery
            L.marker(coords[0]).addTo(map)
            .bindPopup('Rafa pizza <br><a href="https://rafabistro.cz/?lang=cs" target="_blank">Rafa pizza web</a>');
            L.marker(coords[1]).addTo(map)
            .bindPopup('Zendino <br><a href="https://zendino.cz/" target="_blank">Zendino web</a>');
            L.marker(coords[2]).addTo(map)
            .bindPopup('Hood Bistro <br> <a href="https://www.facebook.com/people/Hood-Bistro/100087656991229/" target="_blank">Hood fb</a>');
            L.marker(coords[3]).addTo(map)
            .bindPopup('Restaurace Osaka <br> <a href="https://www.osakarestaurace.cz/" target="_blank">Osaka web</a>');
            L.marker(coords[4]).addTo(map)
            .bindPopup('Skautská 11 <br> <a href="https://www.skautska.cz/podniky/" target="_blank">Skautská 11 web</a>');
            L.marker(coords[5]).addTo(map)
            .bindPopup('Dobroty u Dakoty <br> <a href="https://www.facebook.com/people/Dobroty-u-Dakoty/61579595963257/?locale=cs_CZ" target="_blank">Dobroty u Dakoty web</a>');
            L.marker(coords[6]).addTo(map)
            .bindPopup('Bistruck Havr <br> <a href="https://www.instagram.com/bistruck_havirov/?hl=cs" target="_blank">Bistruck insta</a>');
           /* L.marker([49.83, 18.28]).addTo(map)
            .bindPopup('A pretty CSS3 popup.<br> Easily customizable.')
            .openPopup();*/
            

    </script>
  
  
        </div>        
    </div>
</body>

</html>
